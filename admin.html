<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Flavour Hub — Admin</title>
<style>
  :root{--bg:#0b1220;--card:#0f172a;--ink:#eaf1ff;--muted:#9fb0d0;--line:rgba(255,255,255,.12);--r:16px;--accent:#ef4444;--accent2:#f97316;--max:1100px}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}
  .wrap{max-width:var(--max);margin:0 auto;padding:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}
  h2{margin:0}
  .muted{color:var(--muted);font-size:12px;line-height:1.45}
  input,textarea{
    width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);
    background:rgba(0,0,0,.18);color:var(--ink);outline:none
  }
  textarea{min-height:70px;resize:vertical}
  button{
    padding:10px 12px;border-radius:12px;border:1px solid var(--line);
    background:rgba(255,255,255,.06);color:var(--ink);cursor:pointer;font-weight:900
  }
  button.primary{border:none;background:linear-gradient(135deg,var(--accent),var(--accent2))}
  button.small{padding:8px 10px;border-radius:10px;font-weight:900}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:2fr 1fr 2fr;gap:10px}
  @media(max-width:900px){.row,.row3{grid-template-columns:1fr}}
  .topbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
  .cats{margin-top:10px}
  .cat{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:rgba(255,255,255,.04)}
  .catHd{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:flex-end}
  .item{
    margin-top:10px;
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px;
    background:rgba(0,0,0,.16);
  }
  .preview{
    margin-top:8px;
    width:100%;
    height:160px;
    border-radius:12px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.05);
    overflow:hidden;
    display:grid;
    place-items:center;
    color:rgba(234,241,255,.7);
    font-weight:900;
    font-size:12px;
  }
  .preview img{width:100%;height:100%;object-fit:cover;display:block}
  .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end;margin-top:10px}
.nav-active{
  background: linear-gradient(135deg,var(--accent),var(--accent2));
  border: none;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="topbar">
      <div>
        <h2>Admin Dashboard</h2>
        <div class="muted">Manage menu and view customer orders</div>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button id="menuBtn" class="nav-btn" onclick="showMenu()">Menu</button>
        <button id="discountsBtn" class="nav-btn" onclick="showDiscounts()">Discounts</button>
        <button id="ordersBtn" class="nav-btn" onclick="showOrders()">Orders</button>
        <button onclick="openSite()">Open Site</button>
        <button onclick="logout()">Logout</button>
      </div>
    </div>
  </div>

  <div class="card" id="loginCard">
    <div class="row">
      <div>
        <div class="muted">Admin Password</div>
        <input id="pw" type="password" placeholder="Enter admin password" />
      </div>
      <div style="display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap">
        <button class="primary" type="button" onclick="login()">Login</button>
        <div class="muted" id="loginMsg"></div>
      </div>
    </div>
  </div>

  <div class="card" id="editorCard" style="display:none">
    <div class="topbar">
      <div class="muted" id="status">—</div>
   <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button type="button" onclick="addCategory()">+ Category</button>
        <button class="primary" type="button" onclick="saveMenu()">Save Menu</button>
        <button type="button" onclick="reloadMenu()">Reload</button>
      </div>
    </div>
    <div class="cats" id="cats"></div>
  </div>
   <div class="card" id="ordersCard" style="display:none">
    <div class="topbar">
      <h2>Orders</h2>
      <button onclick="loadOrders()">Refresh</button>
    </div>
    <div id="orders"></div>
  </div>
  <div class="card" id="discountsCard" style="display:none">
    <div class="topbar">
      <h2>Discounts</h2>
      <button onclick="loadDiscounts()">Refresh</button>
    </div>
    <div class="muted" id="discountFormStatus"></div>
    <div class="row3" style="margin-top:10px">
      <div>
        <div class="muted">Code</div>
        <input id="dCode" placeholder="e.g., WELCOME10" />
      </div>
      <div>
        <div class="muted">Type</div>
        <select id="dType">
          <option value="percent">Percent (%)</option>
          <option value="fixed">Fixed amount (GHS)</option>
        </select>
      </div>
      <div>
        <div class="muted">Value</div>
        <input id="dValue" type="number" min="0" step="0.01" placeholder="e.g., 10" />
      </div>
    </div>
    <div class="row" style="margin-top:10px">
      <div>
        <div class="muted">Minimum order (GHS, optional)</div>
        <input id="dMinOrder" type="number" min="0" step="0.01" placeholder="0" />
      </div>
      <div>
        <div class="muted">Expires on (optional)</div>
        <input id="dExpiresAt" type="date" />
      </div>
    </div>
    <div class="actions" style="justify-content:flex-start">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input id="dActive" type="checkbox" style="width:auto" checked /> Active
      </label>
    </div>
    <div class="actions">
      <button type="button" onclick="resetDiscountForm()">Clear</button>
      <button class="primary" type="button" onclick="saveDiscount()">Save Discount</button>
    </div>
    <div class="cats" id="discountsList"></div>
  </div>
</div>
  <script>
const BACKEND_BASE_URL = "https://flavourhub-backend.onrender.com";

let token = localStorage.getItem("fh_admin_token") || "";
let menu = null;
function showMenu(){
  document.getElementById("editorCard").style.display = "block";
  document.getElementById("ordersCard").style.display = "none";
  document.getElementById("discountsCard").style.display = "none";
  setActive("menuBtn");
}

function showOrders(){
  document.getElementById("editorCard").style.display = "none";
  document.getElementById("discountsCard").style.display = "none";
  document.getElementById("ordersCard").style.display = "block";
  setActive("ordersBtn");
  loadOrders();
}

function showDiscounts(){
  document.getElementById("editorCard").style.display = "none";
  document.getElementById("ordersCard").style.display = "none";
  document.getElementById("discountsCard").style.display = "block";
  setActive("discountsBtn");
  loadDiscounts();
}

function setActive(id){
  document.querySelectorAll(".nav-btn").forEach(btn =>
    btn.classList.remove("nav-active")
  );
  document.getElementById(id).classList.add("nav-active");
}

function setStatus(msg){ document.getElementById("status").textContent = msg || ""; }
function openSite(){ window.location.href = "index.html"; }

function logout(){
  token = "";
  localStorage.removeItem("fh_admin_token");
  location.reload();
}

async function login(){
  const password = document.getElementById("pw").value.trim();
  const r = await fetch(`${BACKEND_BASE_URL}/api/admin/login`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ password })
  });
  const data = await r.json().catch(()=>({}));
  if(!r.ok){
    document.getElementById("loginMsg").textContent = data.error || "Login failed";
    return;
  }
  token = data.token;
  localStorage.setItem("fh_admin_token", token);
  document.getElementById("loginMsg").textContent = "Logged in";
  // Ask for notification permission
if ("Notification" in window && Notification.permission !== "granted") {
  Notification.requestPermission();
}

  const bell = document.getElementById("newOrderSound");
if(bell){
  bell.play().then(()=>{
    bell.pause();
    bell.currentTime = 0;
  }).catch(()=>{});
}

  await reloadMenu();
}

async function reloadMenu(){
  setStatus("Loading menu...");
  const r = await fetch(`${BACKEND_BASE_URL}/api/menu`, { cache:"no-store" });
  menu = await r.json();

  document.getElementById("loginCard").style.display = "none";
  document.getElementById("editorCard").style.display = "block";

  setStatus(`Loaded. Updated: ${new Date(menu.updatedAt || Date.now()).toLocaleString()}`);
  render();
showMenu();
}

function addCategory(){
  menu.categories.push({ name:"New Category", items:[] });
  render();
}

function addItem(ci){
  menu.categories[ci].items.push({ id:"", name:"New Item", price:0, desc:"", image:"" });
  render();
}

function delItem(ci, ii){
  menu.categories[ci].items.splice(ii,1);
  render();
}

function delCat(ci){
  menu.categories.splice(ci,1);
  render();
}

function safeImg(url){
  if(!url) return "";
  try{
    const u = new URL(url);
    if(u.protocol !== "http:" && u.protocol !== "https:") return "";
    return u.toString();
  }catch(_){ return ""; }
}

/* Upload image to Cloudinary via your backend */
async function uploadImage(file){
  if(!token) throw new Error("Login required");

  const fd = new FormData();
  fd.append("image", file);

  const r = await fetch(`${BACKEND_BASE_URL}/api/admin/upload`, {
    method: "POST",
    headers: { "Authorization": `Bearer ${token}` },
    body: fd
  });

  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error || "Upload failed");
  if(!data.url) throw new Error("Upload did not return URL");
  return data.url;
}

function render(){
  const cats = document.getElementById("cats");
  cats.innerHTML = "";

  menu.categories.forEach((cat, ci) => {
    const wrap = document.createElement("div");
    wrap.className = "cat";
    wrap.innerHTML = `
      <div class="catHd">
        <div style="flex:1">
          <div class="muted">Category name</div>
          <input value="${escapeHtml(cat.name)}" oninput="menu.categories[${ci}].name=this.value" />
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button type="button" onclick="addItem(${ci})">+ Item</button>
          <button type="button" onclick="delCat(${ci})">Delete Category</button>
        </div>
      </div>
    `;

    (cat.items || []).forEach((it, ii) => {
      const div = document.createElement("div");
      div.className = "item";
      const img = safeImg(it.image || "");
      const fileId = `file_${ci}_${ii}`;

      div.innerHTML = `
        <div class="row3">
          <div>
            <div class="muted">Item name</div>
            <input value="${escapeHtml(it.name||"")}"
                   oninput="menu.categories[${ci}].items[${ii}].name=this.value" />
          </div>
          <div>
            <div class="muted">Price (GHS)</div>
            <input type="number" value="${Number(it.price||0)}"
                   oninput="menu.categories[${ci}].items[${ii}].price=Number(this.value||0)" />
          </div>
          <div>
            <div class="muted">Image URL (auto-filled by upload)</div>
            <input data-role="imageUrl"
                   value="${escapeHtml(it.image||"")}"
                   oninput="menu.categories[${ci}].items[${ii}].image=this.value; refreshPreview(this, ${ci}, ${ii})" />
          </div>
        </div>

        <div class="preview">
          ${img ? `<img src="${img}" alt="" />` : `No Image`}
        </div>

        <div class="actions">
          <input id="${fileId}" type="file" accept="image/jpeg,image/png,image/webp" style="display:none" />
          <button class="small" type="button" onclick="document.getElementById('${fileId}').click()">Upload from device</button>
          <button class="small" type="button" onclick="clearImage(${ci},${ii})">Remove image</button>
          <button class="small" type="button" onclick="delItem(${ci},${ii})">Remove item</button>
        </div>

        <div style="margin-top:10px">
          <div class="muted">Description</div>
          <textarea oninput="menu.categories[${ci}].items[${ii}].desc=this.value">${escapeHtml(it.desc||"")}</textarea>
        </div>

        <div class="muted" style="margin-top:8px" data-msg="uploadMsg"></div>
      `;

      // Wire upload handler (IMPORTANT: never set file input value to URL)
      setTimeout(() => {
        const fileEl = document.getElementById(fileId);
        const msgEl = div.querySelector('[data-msg="uploadMsg"]');
        const urlInput = div.querySelector('[data-role="imageUrl"]');
        const preview = div.querySelector(".preview");

        fileEl.addEventListener("change", async () => {
          const f = fileEl.files?.[0];
          if(!f) return;

          msgEl.textContent = "Uploading...";
          try{
            const url = await uploadImage(f);

            // Save URL into the menu item
            menu.categories[ci].items[ii].image = url;

            // Update ONLY the Image URL text input (NOT the file input)
            urlInput.value = url;

            // Update preview
            preview.innerHTML = `<img src="${url}" alt="" />`;

            msgEl.textContent = "Uploaded. Click “Save Menu” to publish.";
          }catch(e){
            msgEl.textContent = "Upload failed: " + (e.message || "Error");
          }finally{
            // Allowed: clear the file input
            fileEl.value = "";
          }
        });
      }, 0);

      wrap.appendChild(div);
    });

    cats.appendChild(wrap);
  });
}

function clearImage(ci, ii){
  menu.categories[ci].items[ii].image = "";
  render();
}

function refreshPreview(input, ci, ii){
  const card = input.closest(".item");
  const prev = card.querySelector(".preview");
  const url = safeImg(menu.categories[ci].items[ii].image || "");
  prev.innerHTML = url ? `<img src="${url}" alt="" />` : `No Image`;
}

async function saveMenu(){
  if(!token){ alert("Login first"); return; }
  setStatus("Saving...");

  const r = await fetch(`${BACKEND_BASE_URL}/api/admin/menu`, {
    method:"PUT",
    headers:{
      "Content-Type":"application/json",
      "Authorization": `Bearer ${token}`
    },
    body: JSON.stringify(menu)
  });

  const data = await r.json().catch(()=>({}));
  if(!r.ok){
    setStatus(data.error || "Save failed");
    if((data.error||"").includes("Invalid/expired")) logout();
    return;
  }

  menu = data;
  setStatus(`Saved. Updated: ${new Date(menu.updatedAt || Date.now()).toLocaleString()}`);
  render();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  }
  function playBellSound(){
  const bell = document.getElementById("newOrderSound");
  if(!bell) return;

  bell.volume = 1.0; // maximum volume
  bell.currentTime = 0;
  bell.play().catch(()=>{});
}
function showPhoneNotification(order){
  if(!("Notification" in window)) return;
  if(Notification.permission !== "granted") return;

  new Notification("🛎 New Order Received!", {
    body: `${order.customer?.name || "Customer"} • GHS ${order.totals?.total}`,
    icon: "https://cdn-icons-png.flaticon.com/512/2838/2838912.png"
  });
}


(async function init(){
  if(token){
    try{ await reloadMenu(); } catch(e){ /* ignore */ }
  }
})();
let orders = [];
let lastOrderCount = 0;
let hasLoadedOrders = false;

async function loadOrders(){
  if(!token){
    document.getElementById("orders").innerHTML =
      `<div class="muted">Login required to view orders</div>`;
    return;
  }

  try{
    const r = await fetch(`${BACKEND_BASE_URL}/api/orders/admin`, {
      headers:{ "Authorization": `Bearer ${token}` }
    });

    if(!r.ok){
      const err = await r.json().catch(()=>({}));
      throw new Error(err.error || "Failed to load orders");
    }

    orders = await r.json();
    renderOrders();
  }catch(e){
    document.getElementById("orders").innerHTML =
      `<div class="muted">⚠ ${e.message}</div>`;
  }
}

function renderOrders(){
  const el = document.getElementById("orders");
  el.innerHTML = "";

  // 🔔 Detect new order
if(hasLoadedOrders && orders.length > lastOrderCount){
  playBellSound();
  showPhoneNotification(orders[0]);
}

lastOrderCount = orders.length;
hasLoadedOrders = true;

  if(!orders.length){
    el.innerHTML = `<div class="muted">No orders yet</div>`;
    return;
  }

  orders.forEach(o=>{
    const d = document.createElement("div");
    d.className = "item";
    d.innerHTML = `
      <strong>${o.id || o.reference}</strong>
      <div class="muted">${new Date(o.createdAt).toLocaleString()}</div>
      <div><b>${o.customer?.name}</b> • ${o.customer?.phone}</div>
      ${o.delivery ? `<div class="muted">${o.delivery.address}</div>` : `<div class="muted">Pickup</div>`}
      <ul>
        ${(o.items||[]).map(i=>`<li>${i.qty} × ${i.name}</li>`).join("")}
      </ul>
      <strong>Total: GHS ${o.totals?.total}</strong>
    `;
    el.appendChild(d);
  });
}
setInterval(() => {
  if(
    token &&
    document.getElementById("ordersCard").style.display === "block"
  ){
    loadOrders();
  }
}, 20000); // every 20 seconds

let discounts = [];
let editingDiscountId = null;

function setDiscountFormStatus(msg){
  document.getElementById("discountFormStatus").textContent = msg || "";
}

function resetDiscountForm(){
  editingDiscountId = null;
  document.getElementById("dCode").value = "";
  document.getElementById("dType").value = "percent";
  document.getElementById("dValue").value = "";
  document.getElementById("dMinOrder").value = "";
  document.getElementById("dExpiresAt").value = "";
  document.getElementById("dActive").checked = true;
  setDiscountFormStatus("");
}

async function loadDiscounts(){
  if(!token){
    document.getElementById("discountsList").innerHTML =
      `<div class="muted">Login required to manage discounts</div>`;
    return;
  }

  setDiscountFormStatus("Loading discounts...");
  try{
    const r = await fetch(`${BACKEND_BASE_URL}/api/admin/discounts`, {
      headers:{ "Authorization": `Bearer ${token}` }
    });

    if(!r.ok){
      const err = await r.json().catch(()=>({}));
      throw new Error(err.error || "Failed to load discounts");
    }

    discounts = await r.json();
    setDiscountFormStatus("");
    renderDiscounts();
  }catch(e){
    document.getElementById("discountsList").innerHTML =
      `<div class="muted">⚠ ${e.message}</div>`;
    setDiscountFormStatus("");
  }
}

function renderDiscounts(){
  const el = document.getElementById("discountsList");
  el.innerHTML = "";

  if(!discounts.length){
    el.innerHTML = `<div class="muted">No discounts yet. Create one above.</div>`;
    return;
  }

  discounts.forEach(d=>{
    const card = document.createElement("div");
    card.className = "item";
    const valueLabel = d.type === "fixed" ? `GHS ${Number(d.value||0)} off` : `${Number(d.value||0)}% off`;
    const expiry = d.expiresAt ? new Date(d.expiresAt).toLocaleDateString() : "No expiry";
    card.innerHTML = `
      <div class="catHd">
        <div>
          <strong>${escapeHtml(d.code||"")}</strong>
          <div class="muted">${valueLabel} • Min order: GHS ${Number(d.minOrder||0)} • ${expiry}</div>
          <div class="muted">Status: ${d.active ? "Active" : "Inactive"}</div>
        </div>
        <div class="actions" style="margin-top:0">
          <button class="small" type="button" onclick="editDiscount('${d.id}')">Edit</button>
          <button class="small" type="button" onclick="toggleDiscountActive('${d.id}')">${d.active ? "Deactivate" : "Activate"}</button>
          <button class="small" type="button" onclick="deleteDiscount('${d.id}')">Delete</button>
        </div>
      </div>
    `;
    el.appendChild(card);
  });
}

function editDiscount(id){
  const d = discounts.find(x => x.id === id);
  if(!d) return;
  editingDiscountId = d.id;
  document.getElementById("dCode").value = d.code || "";
  document.getElementById("dType").value = d.type === "fixed" ? "fixed" : "percent";
  document.getElementById("dValue").value = Number(d.value||0);
  document.getElementById("dMinOrder").value = Number(d.minOrder||0);
  document.getElementById("dExpiresAt").value = d.expiresAt ? String(d.expiresAt).slice(0,10) : "";
  document.getElementById("dActive").checked = !!d.active;
  setDiscountFormStatus(`Editing "${d.code}"`);
}

function validateDiscountForm(payload){
  if(!payload.code) return "Discount code is required.";
  if(!["percent","fixed"].includes(payload.type)) return "Invalid discount type.";
  if(!Number.isFinite(payload.value) || payload.value <= 0) return "Value must be a positive number.";
  if(payload.type === "percent" && payload.value > 100) return "Percent discount cannot exceed 100.";
  if(!Number.isFinite(payload.minOrder) || payload.minOrder < 0) return "Minimum order must be zero or more.";
  return "";
}

async function saveDiscount(){
  if(!token){ alert("Login first"); return; }

  const payload = {
    code: document.getElementById("dCode").value.trim().toUpperCase(),
    type: document.getElementById("dType").value,
    value: Number(document.getElementById("dValue").value || 0),
    minOrder: Number(document.getElementById("dMinOrder").value || 0),
    expiresAt: document.getElementById("dExpiresAt").value || null,
    active: document.getElementById("dActive").checked
  };

  const validationError = validateDiscountForm(payload);
  if(validationError){ setDiscountFormStatus(validationError); return; }

  setDiscountFormStatus("Saving...");
  try{
    const isEdit = !!editingDiscountId;
    const url = isEdit
      ? `${BACKEND_BASE_URL}/api/admin/discounts/${encodeURIComponent(editingDiscountId)}`
      : `${BACKEND_BASE_URL}/api/admin/discounts`;

    const r = await fetch(url, {
      method: isEdit ? "PUT" : "POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify(payload)
    });

    const data = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.error || "Failed to save discount");

    resetDiscountForm();
    await loadDiscounts();
  }catch(e){
    setDiscountFormStatus(e.message || "Failed to save discount");
  }
}

async function toggleDiscountActive(id){
  const d = discounts.find(x => x.id === id);
  if(!d || !token) return;

  try{
    const r = await fetch(`${BACKEND_BASE_URL}/api/admin/discounts/${encodeURIComponent(id)}`, {
      method:"PUT",
      headers:{
        "Content-Type":"application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify({ ...d, active: !d.active })
    });

    const data = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.error || "Failed to update discount");

    await loadDiscounts();
  }catch(e){
    setDiscountFormStatus(e.message || "Failed to update discount");
  }
}

async function deleteDiscount(id){
  if(!token) return;
  if(!confirm("Delete this discount? This cannot be undone.")) return;

  try{
    const r = await fetch(`${BACKEND_BASE_URL}/api/admin/discounts/${encodeURIComponent(id)}`, {
      method:"DELETE",
      headers:{ "Authorization": `Bearer ${token}` }
    });

    const data = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.error || "Failed to delete discount");

    if(editingDiscountId === id) resetDiscountForm();
    await loadDiscounts();
  }catch(e){
    setDiscountFormStatus(e.message || "Failed to delete discount");
  }
}

</script>
